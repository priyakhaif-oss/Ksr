<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - KSR Dairy Foods</title>

<link rel="stylesheet" href="/static/css/style.css">

</head>


<body>


<header>

<div class="logo">
🥛 KSR Dairy Foods
</div>


<a href="/cart" class="cart-btn">
🛒 Cart
</a>


</header>





<section id="products">


<h2>
Checkout 🥛
</h2>



<div class="card checkout-card">



<h3>
📦 Order Summary
</h3>



{% for item in cart %}


<p>
{{item.name}} × {{item.qty}}
</p>


<p>
₹{{item.price * item.qty}}
</p>


<hr>


{% endfor %}




<h2>
Total : ₹{{total}}
</h2>





<form action="/place-order" method="POST">





<input
type="text"
name="name"
placeholder="Enter Your Name"
required>




<input
type="tel"
name="phone"
placeholder="Enter Phone Number"
required>




<textarea
name="address"
placeholder="Enter Delivery Address"
required></textarea>





<button type="submit">

Place Order ✅

</button>




</form>




</div>



</section>





<footer>


<p>
© 2026 KSR Dairy Foods
</p>


<p>
Fresh Milk Delivered Daily 🥛
</p>


</footer>




</body>

</html>
