<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - KSR Dairy Foods</title>

<link rel="stylesheet" href="/static/css/style.css">

</head>


<body>


<section class="hero">


<div class="card">


<h2>
🔐 Admin Login
</h2>


<br>


{% if error %}

<p style="color:red;">
{{error}}
</p>

{% endif %}



<form action="/admin-login" method="POST">



<input
type="text"
name="username"
placeholder="Username"
required
style="
width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
">





<input
type="password"
name="password"
placeholder="Password"
required
style="
width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
">





<button type="submit">

Login 🔐

</button>



</form>



</div>


</section>




<footer>

<p>
© 2026 KSR Dairy Foods
</p>

</footer>



</body>

</html>
