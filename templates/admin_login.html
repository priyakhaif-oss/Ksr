<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KSR Dairy Foods - Admin Login</title>

<link rel="stylesheet" href="/static/css/style.css">

</head>


<body>


<section class="hero">


<div class="card login-card">


<h2>
Admin Login
</h2>


<p>
Access KSR Dairy Foods Dashboard
</p>



{% if error %}

<p style="color:#dc2626;">
{{error}}
</p>

{% endif %}




<form action="/admin-login" method="POST">



<input
type="text"
name="username"
placeholder="Username"
required
>




<input
type="password"
name="password"
placeholder="Password"
required
>



<button type="submit">

Login

</button>



</form>



</div>


</section>





<footer>

<p>
© 2026 KSR Dairy Foods
</p>

</footer>



</body>

</html>
