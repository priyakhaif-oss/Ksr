<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>{{site_name}} | Admin Login</title>


<link rel="icon" type="image/png" href="/static/images/favicon.png">


<link rel="stylesheet" href="/static/css/style.css">


</head>



<body>





<section class="hero">





<div class="card login-card">






<a href="/" class="logo login-logo">


<img src="/static/images/logo.png" alt="{{site_name}}">


<span>
{{site_name}}
</span>


</a>







<h2>
Admin Login
</h2>





<p>
Access {{site_name}} Dashboard
</p>






{% if error %}



<p style="
color:#dc2626;
margin:15px 0;
font-weight:600;
">

{{error}}

</p>



{% endif %}







<form action="/admin-login" method="POST">



<input

type="text"

name="username"

placeholder="Username"

required

>




<input

type="password"

name="password"

placeholder="Password"

required

>





<button type="submit">

Login

</button>



</form>






</div>





</section>








<footer>

<p>
© 2026 {{site_name}}
</p>


<p>
Admin Portal
</p>

</footer>







</body>

</html>
